name: integration-pipeline-ros2

on: 
  push:
    branches: [ "jazzy" ]
  pull_request:
    branches: [ "jazzy" ]

  workflow_dispatch:
    inputs:
      example_input:
        description: 'An example input'
        required: false
        default: 'default value'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full
      options: --user root  # Needed for installing additional dependencies with apt
    steps:
      - uses: actions/checkout@v3
        with:
          path: ros2_ws/src/

      - name: Install dependencies
        run: |
          apt update
          apt install -y python3-colcon-common-extensions python3-rosdep lsb-release curl gnupg2

      - name: Initialize rosdep
        run: |
          rosdep init || echo "rosdep already initialized"
          rosdep update --include-eol-distros

      - name: Install ROS 2 dependencies
        run: |
          cd ros2_ws
          rosdep install --from-paths src -y --ignore-src

      - name: Build the workspace
        run: |
          cd ros2_ws
          colcon build
